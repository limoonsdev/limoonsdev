<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Limoonsdev">
  <title>Limoonsdev</title>
  <style>@font-face{font-family:'Pixelify Sans';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Pixelify Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');} text{font-family:'Pixelify Sans',monospace;}</style>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#222538" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="14" fill="#1a1b27"/>
  <rect width="1000" height="300" rx="14" fill="url(#grid)"/>

  <!-- pixel sparkle, top right -->
  <g fill="#7aa2f7">
    <rect x="840" y="60" width="20" height="20"/>
    <rect x="840" y="40" width="20" height="20"/>
    <rect x="840" y="80" width="20" height="20"/>
    <rect x="820" y="60" width="20" height="20"/>
    <rect x="860" y="60" width="20" height="20"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
  </g>
  <g fill="#7aa2f7" opacity="0.45">
    <rect x="920" y="140" width="10" height="10"/>
    <rect x="900" y="30" width="10" height="10"/>
    <rect x="780" y="120" width="10" height="10"/>
  </g>

  <text x="60" y="152" font-size="96" font-weight="700" fill="#c0caf5">Limoonsdev</text>
  <text x="64" y="204" font-size="26" font-weight="400" fill="#7aa2f7">I build things with AI and play way too many games.</text>

  <text x="64" y="256" font-size="20" font-weight="400" fill="#6b7394">> now building: <tspan fill="#c0caf5">Sandle Launcher</tspan></text>
  <rect x="373.6" y="240" width="11" height="20" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
